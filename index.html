<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drift Portfolio</title>
  <meta name="description" content="An interactive 2D portfolio where a drifting car reveals my projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="world"></div>

  <header class="hud top">
    <div class="brand">
      <h1 id="name">Your Name</h1>
      <p id="tagline"></p>
      <div class="social" id="social"></div>
    </div>
    <nav>
      <button id="btnProjects" class="pill" type="button">Projects <span id="count" class="badge">0/0</span></button>
      <button id="btnDrive" class="pill accent" type="button">Take the wheel</button>
      <button id="btnSound" class="pill ghost" type="button">Sound: off</button>
      <a href="admin.html" class="pill ghost">Admin</a>
    </nav>
  </header>

  <div id="score" class="hud score hidden">
    <div id="drift"></div>
    <div id="total">SCORE 0</div>
  </div>

  <div id="hint" class="hud hint"></div>
  <div id="toast" class="toast"></div>

  <aside id="panel" class="panel" aria-label="All projects">
    <div class="panel-head">
      <h2>All projects</h2>
      <button id="btnClose" class="pill ghost" type="button" aria-label="Close">Close</button>
    </div>
    <ul id="plist"></ul>
  </aside>

  <div id="touch" class="touch hidden">
    <div class="pad l">
      <button type="button" data-k="left" aria-label="Steer left">&#9664;</button>
      <button type="button" data-k="right" aria-label="Steer right">&#9654;</button>
    </div>
    <div class="pad r">
      <button type="button" data-k="brake" class="wide">DRIFT</button>
      <button type="button" data-k="down" aria-label="Brake">&#9660;</button>
      <button type="button" data-k="up" class="wide go">GAS</button>
    </div>
  </div>

  <script src="track.js"></script>
  <script src="store.js"></script>
  <script src="game.js"></script>
</body>
</html>
